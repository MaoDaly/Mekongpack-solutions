<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <div class="form-group">
            <div class="fullname-form">
            <label for="">Full name</label>
            <input type="text" placeholder="Enter your full name"> </div>
            <div class="email-form">
            <label for="">Email</label>
            <input type="text" placeholder="Enter your email"> </div>
        </div>
        <div class="form-group">
            <div class="company-form">
                <label for="">Company/Organization</label>
                <input type="text" placeholder="Enter your company name"> </div>
                <div class="phone-form">
                    <label for="">Phone number</label>
                    <input type="text" placeholder="Enter your phone number">
                </div>
             </div>
             <div class="message-form">
                <label for="">Message</label>
                <input type="text" class="message" placeholder="Tell us what you need">
             </div>
             <button class="btn">Send inquiry</button>
    </form>


    <button class="product-btn"> Product inquiry</button>
    <button class="partnership-btn"> Partnership</button>
</body>
</html>
